name: Android CI (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, Test & Publish (single Gradle invocation)
        env:
          USERNAME: ${{ secrets.USERNAME }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          ./gradlew :sampleapp:assembleRelease publishToMavenLocal testDebugUnitTest :messages:test \
            publishAllPublicationsToGitHubPackagesRepository -PbuildRelease

      - name: Android Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }} # IMPORTANT: run Android Test Report regardless

      - name: Validate Gradle wrapper (attempt 1)
        id: validate_gradle_wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@v5

      - name: Validate Gradle wrapper (retry)
        id: validate_gradle_wrapper_retry
        if: ${{ steps.validate_gradle_wrapper.outcome == 'failure' }}
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@v5

      - name: Warn if Gradle wrapper validation failed twice
        if: ${{ steps.validate_gradle_wrapper.outcome == 'failure' && steps.validate_gradle_wrapper_retry.outcome == 'failure' }}
        run: |
          echo "::warning::Gradle wrapper validation failed twice (likely network reachability to Gradle checksum services)."

      - name: Set RELEASE_VERSION env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Poll jitpack.io to update builds
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          echo "Release version: $RELEASE_VERSION"
          version_url="https://jitpack.io/api/builds/com.github.jwoglom/pumpX2/$RELEASE_VERSION"
          builds_url="https://jitpack.io/api/builds/com.github.jwoglom.pumpX2/"

          # Requesting the version is what starts jitpack's build of it.
          curl -sS "$version_url" || /bin/true
          echo

          appear_deadline=$(( $(date +%s) + 3 * 60 ))
          deadline=$(( $(date +%s) + 45 * 60 ))
          while true; do
            status=$(curl -sS "$builds_url" | jq -r --arg v "$RELEASE_VERSION" '.["com.github.jwoglom"].pumpX2[$v] // "missing"' || echo "unreachable")
            echo "jitpack status for $RELEASE_VERSION: $status"
            case "$status" in
              ok) break ;;
              Error)
                echo "::error::jitpack build of $RELEASE_VERSION failed: https://jitpack.io/com/github/jwoglom/pumpX2/$RELEASE_VERSION/build.log"
                exit 1 ;;
            esac
            if [ "$status" = "missing" ] && [ "$(date +%s)" -ge "$appear_deadline" ]; then
              echo "::error::jitpack has not listed a build of $RELEASE_VERSION after 3 minutes"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::jitpack build of $RELEASE_VERSION still '$status' after 45 minutes"
              exit 1
            fi
            sleep 30
          done

          curl -sS "$version_url" || /bin/true
          echo
