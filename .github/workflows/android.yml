name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Cancel superseded runs on the same branch / PR so they don't race the Gradle
# remote cache and waste runner minutes. Tag builds (release workflow) are not
# affected by this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Assemble & Test & Publish (single Gradle invocation)
      # One daemon: assembleDebug + assembleRelease produce the APK artifacts,
      # publishToMavenLocal produces the m2 artifacts, testDebugUnitTest runs
      # tests reusing the already-compiled outputs. Drops `gradle build` which
      # also runs lintAnalyzeDebug, lintVitalAnalyzeRelease, and
      # testReleaseUnitTest — none of which CI ships.
      #
      # :messages:test is named explicitly because testDebugUnitTest only exists
      # on the Android modules; messages is a plain Java library whose tests live
      # on the `test` task, so without this its suite never runs. A bare `test`
      # would work but also pulls in testReleaseUnitTest on the Android modules,
      # which is exactly what the comment above says this invocation drops.
      run: ./gradlew :sampleapp:assembleDebug :sampleapp:assembleRelease publishToMavenLocal testDebugUnitTest :messages:test

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: sampleapp-debug.apk
        path: sampleapp/build/outputs/apk/debug/sampleapp-debug.apk

    - name: Upload release (unsigned) APK
      uses: actions/upload-artifact@v4
      with:
        name: sampleapp-release-unsigned.apk
        path: sampleapp/build/outputs/apk/release/sampleapp-release-unsigned.apk

    - name: Upload m2 androidLib AAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-android.aar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-android/*/pumpx2-android-[0-9.]*.aar

    - name: Upload m2 androidLib source JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-android-sources.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-android/*/pumpx2-android-[0-9.]*-sources.jar

    - name: Upload m2 messages JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-messages.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-messages/*/pumpx2-messages-[0-9.]*.jar

    - name: Upload m2 shared JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-shared.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-shared/*/pumpx2-shared-[0-9.]*.jar

    - name: Upload m2 messages fat JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-messages-all.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-messages/*/pumpx2-messages-[0-9.]*-all.jar

    - name: Upload m2 messages source JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-messages-sources.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-messages/*/pumpx2-messages-[0-9.]*-sources.jar

    - name: Upload m2 cliparser fat JAR
      uses: actions/upload-artifact@v4
      with:
        name: pumpx2-cliparser-all.jar
        path: ~/.m2/repository/com/jwoglom/pumpx2/pumpx2-cliparser/*/pumpx2-cliparser-[0-9.]*-all.jar

    - name: Upload generated m2 repository
      uses: actions/upload-artifact@v4
      with:
        name: maven-repository.zip
        path: |
          ~/.m2/repository/


    - name: Android Test Report
      uses: asadmansr/android-test-report-action@v1.2.0
      if: ${{ always() }} # IMPORTANT: run Android Test Report regardless

    - name: Validate Gradle wrapper (attempt 1)
      id: validate_gradle_wrapper
      continue-on-error: true
      uses: gradle/actions/wrapper-validation@v5

    - name: Validate Gradle wrapper (retry)
      id: validate_gradle_wrapper_retry
      if: ${{ steps.validate_gradle_wrapper.outcome == 'failure' }}
      continue-on-error: true
      uses: gradle/actions/wrapper-validation@v5

    - name: Warn if Gradle wrapper validation failed twice
      if: ${{ steps.validate_gradle_wrapper.outcome == 'failure' && steps.validate_gradle_wrapper_retry.outcome == 'failure' }}
      run: |
        echo "::warning::Gradle wrapper validation failed twice (likely network reachability to Gradle checksum services)."

